name: m2-bot

on:

  push:
    branches:
      - "main"

  repository_dispatch:
    types:
      - "gas_trigger"

  workflow_dispatch:


jobs:

  screenshot:

    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-22.04

    timeout-minutes: 15


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.51.1
          npx playwright install --with-deps chromium


      - name: Capture screenshot

        env:

          TARGET_URL: https://bitcoincounterflow.com/charts/m2-global/


        run: |

          cat > screenshot.js <<'EOF'

          const { chromium } = require("playwright");


          const OUT = "chart.png";
          const ERROR = "error.png";


          (async()=>{


            const browser =
              await chromium.launch({

                headless:true,

                args:[

                  "--disable-dev-shm-usage",
                  "--no-sandbox",
                  "--disable-setuid-sandbox"

                ]

              });



            let page;



            try{


              const context =
                await browser.newContext({

                  viewport:{

                    width:1920,
                    height:1080

                  },

                  deviceScaleFactor:1,

                  locale:"en-US",

                  timezoneId:"Asia/Taipei"

                });



              page =
                await context.newPage();



              page.setDefaultTimeout(180000);



              console.log(
                "開啟:",
                process.env.TARGET_URL
              );



              await page.goto(

                process.env.TARGET_URL,

                {

                  waitUntil:"domcontentloaded",

                  timeout:180000

                }

              );



              console.log(
                "等待圖表載入..."
              );


              await page.waitForTimeout(
                120000
              );



              await page.mouse.move(
                500,
                500
              );



              await page.screenshot({

                path:OUT,

                fullPage:true,

                animations:"disabled"

              });



              console.log(
                "完成"
              );


            }


            catch(err){


              console.error(
                err
              );


              if(page){

                await page.screenshot({

                  path:ERROR,

                  fullPage:true

                });

              }


              process.exit(1);


            }


            finally{


              await browser.close();


            }


          })();

          EOF


          node screenshot.js



      - name: Send to Discord

        if: always()


        env:

          DISCORD_WEBHOOK:
            ${{ secrets.DISCORD_WEBHOOK }}


          TARGET_URL:
            https://bitcoincounterflow.com/charts/m2-global/


        run:


          if [ -f chart.png ]; then


            curl --fail-with-body -sS \
              -F "file=@chart.png" \
              -F "payload_json={\"content\":\"📊 M2 Chart\n${TARGET_URL}\"}" \
              "$DISCORD_WEBHOOK"


          elif [ -f error.png ]; then


            curl --fail-with-body -sS \
              -F "file=@error.png" \
              -F "payload_json={\"content\":\"❌ Screenshot failed\n${TARGET_URL}\"}" \
              "$DISCORD_WEBHOOK"


          else


            echo "沒有任何圖片輸出"
            exit 1


          fi
