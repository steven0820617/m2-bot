name: m2-bot

on:

  push:
    branches:
      - "main"

  repository_dispatch:
    types:
      - "gas_trigger"

  workflow_dispatch:


jobs:

  screenshot:

    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-22.04

    timeout-minutes: 15


    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: "22"



      - name: Install Playwright

        run: |

          npm init -y

          npm install playwright@1.51.1

          npx playwright install --with-deps chromium



      - name: Capture screenshot

        env:

          TARGET_URL: https://bitcoincounterflow.com/charts/m2-global/


        run: |


          cat > screenshot.js <<'EOF'


          const { chromium } = require("playwright");


          const OUT = "chart.png";
          const ERROR = "error.png";


          (async()=>{


            const browser = await chromium.launch({

              headless:true,

              channel:"chrome",

              args:[

                "--no-sandbox",

                "--disable-setuid-sandbox",

                "--disable-dev-shm-usage",

                "--disable-blink-features=AutomationControlled"

              ]

            });



            let page;



            try{


              const context = await browser.newContext({

                viewport:{

                  width:1920,

                  height:1080

                },


                locale:"en-US",


                timezoneId:"Asia/Taipei",


                userAgent:

                "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36",


                extraHTTPHeaders:{


                  "Accept-Language":

                  "en-US,en;q=0.9"


                }


              });



              page = await context.newPage();



              page.setDefaultTimeout(180000);



              console.log(

                "Opening:",

                process.env.TARGET_URL

              );



              await page.goto(

                process.env.TARGET_URL,

                {

                  waitUntil:"networkidle",

                  timeout:180000

                }

              );



              console.log(

                "Checking page..."

              );



              await page.waitForTimeout(15000);



              const title = await page.title();


              console.log(

                "TITLE:",

                title

              );



              await page.mouse.move(

                800,

                400

              );



              await page.waitForTimeout(3000);



              await page.screenshot({

                path:OUT,

                fullPage:true,

                animations:"disabled"

              });



              console.log(

                "Screenshot success"

              );


            }


            catch(err){


              console.error(err);



              if(page){


                await page.screenshot({

                  path:ERROR,

                  fullPage:true

                });


              }


              process.exit(1);


            }


            finally{


              await browser.close();


            }



          })();


          EOF



          node screenshot.js




      - name: Send to Discord

        if: always()


        env:

          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

          TARGET_URL: https://bitcoincounterflow.com/charts/m2-global/


        shell: bash


        run: |


          if [ -z "$DISCORD_WEBHOOK" ]; then

            echo "ERROR: DISCORD_WEBHOOK 未設定"

            exit 1

          fi



          if [ -f chart.png ]; then


            curl \
              --fail-with-body \
              -sS \
              -F "file=@chart.png" \
              -F "payload_json={\"content\":\"📊 M2 Chart Screenshot ${TARGET_URL}\"}" \
              "$DISCORD_WEBHOOK"



          elif [ -f error.png ]; then


            curl \
              --fail-with-body \
              -sS \
              -F "file=@error.png" \
              -F "payload_json={\"content\":\"❌ Screenshot Failed ${TARGET_URL}\"}" \
              "$DISCORD_WEBHOOK"



          else


            echo "No screenshot file"

            exit 1


          fi
